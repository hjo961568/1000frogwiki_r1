<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>개구리위키</title>

<style>
body {
    background-color: #fff2b2;
}

table {
    border-collapse: collapse;
}

td {
    width: 300px;
    height: 20px;
    border: 2px solid black;
    text-align: left;
}

.label {
    width: 80px;
    background-color: #ffd400;
    text-align: center;
}

tr:nth-child(2) {
    height: 300px;
}
  
</style>
  
</head>
<body>
  
<h1>천개구리위키</h1>

<p>"천개구리"라는 하나의 생명체를 위한 위키</p>
  
<table>
  <tr>
    
    <td class="label" colspan="2">천예준</td>
    
  </tr>
  
  <tr>
    <td colspan="2">
        <img src="Images/profile.jpg" alt="천예준 사진" 
          width="350" height="300">
    </td>
  </tr>
  
  <tr>
    <td class="label">본명</td>
    <td>천예준(Chun Ye-jun)</td>
  </tr>
  
  <tr>
    <td class="label" rowspan="2">출생</td>
    <td>2007년 8월 7일(19세)</td>
  </tr>

  <tr>
    <td>서울특별시 강남구 청담동(본인 주장)</td>
  </tr>

  <tr>
    <td class="label">거주지</td>
    <td>경상북도 포항시 북구 장성동<br>두산위브더제니스</td>
  </tr>

<tr>
    <td class="label">국적</td>
    <td>
        <img src="Images/korean flag.jpg" alt="태극기"
             width="30" height="20" style="vertical-align: middle;"> 대한민국
    </td>
</tr>

  <tr>
    <td class="label">학력</td>
    <td>장량초등학교(졸업)<br>대도중학교(졸업)<br>포항장성고등학교(졸업)<br>대구가톨릭대학교(미래자동차공학과/재학)</td>
  </tr>

  <tr>
    <td class="label">링크</td>
    <td>4</td>
  </tr>
  
</table>
  
</body>
</html>
